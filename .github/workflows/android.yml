name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Ensures Gradle is available on PATH even if gradlew was not committed
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Locate Project & Build APK
        run: |
          echo "=== Inspecting workspace files ==="
          ls -la

          # 1. Locate the directory containing gradlew or build/settings gradle files
          PROJECT_DIR=""
          if [ -f "./gradlew" ]; then
            PROJECT_DIR="."
          elif [ $(find . -maxdepth 3 -name "gradlew" | wc -l) -gt 0 ]; then
            PROJECT_DIR=$(dirname $(find . -maxdepth 3 -name "gradlew" | head -n 1))
          elif [ $(find . -maxdepth 3 -name "settings.gradle*" | wc -l) -gt 0 ]; then
            PROJECT_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle*" | head -n 1))
          elif [ $(find . -maxdepth 3 -name "build.gradle*" | wc -l) -gt 0 ]; then
            PROJECT_DIR=$(dirname $(find . -maxdepth 3 -name "build.gradle*" | head -n 1))
          else
            PROJECT_DIR="."
          fi

          echo "=== Using Project Directory: $PROJECT_DIR ==="
          cd "$PROJECT_DIR"

          # 2. If gradlew is missing from the repository, generate it
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found in $PROJECT_DIR. Generating wrapper..."
            gradle wrapper
          fi

          # 3. Grant execute permission
          chmod +x ./gradlew

          # 4. Build debug APK
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/**/*.apk'