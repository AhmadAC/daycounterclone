<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Days Counter - Web Edition</title>
    <style>
        /* CSS Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000000; color: #FFFFFF; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        
        /* Main Container matching Window limits */
        #app {
            background-color: #1A1A1A;
            width: 100%;
            max-width: 500px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Top Bar */
        .top-bar { padding: 16px 16px 8px 16px; display: flex; flex-direction: column; gap: 10px; }
        .header-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .title-container { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: bold; }
        .title-container svg { width: 36px; height: 36px; }
        .action-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
        
        button { cursor: pointer; transition: background 0.2s; border: none; }
        .btn {
            background-color: #282828; color: #FFFFFF; border: 1px solid #3E3E3E;
            border-radius: 4px; padding: 6px 10px; font-size: 12px;
        }
        .btn:hover { background-color: #383838; }
        .btn-clear { color: #E57373; border-color: #5C3232; }
        .btn-clear:hover { background-color: #4A2222; }
        .today-label { text-align: center; color: #8E8E8E; font-size: 13px; margin-top: 4px; margin-bottom: 8px;}

        /* Sort Dropdown Native overriding */
        select.btn { appearance: none; outline: none; padding-right: 24px; background: #282828 url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>") no-repeat right 4px center / 16px; }

        /* Tabs */
        .tabs { display: flex; background: #1A1A1A; padding: 0 16px; gap: 2px; overflow-x: auto; scrollbar-width: none; }
        .tab {
            background: #282828; color: #A0A0A0; padding: 8px 16px; font-size: 13px;
            border-top-left-radius: 4px; border-top-right-radius: 4px; white-space: nowrap;
        }
        .tab:hover:not(.active) { background: #383838; }
        .tab.active { background: #F16529; color: #FFFFFF; font-weight: bold; }

        /* Scroll Area */
        .scroll-area {
            flex: 1; overflow-y: auto; padding: 10px 16px 80px 16px; display: flex; flex-direction: column; gap: 10px;
        }
        .scroll-area::-webkit-scrollbar { width: 8px; }
        .scroll-area::-webkit-scrollbar-track { background: #1A1A1A; }
        .scroll-area::-webkit-scrollbar-thumb { background: #444444; border-radius: 4px; }
        .scroll-area::-webkit-scrollbar-thumb:hover { background: #F16529; }
        
        .empty-label { text-align: center; color: #707070; margin-top: 60px; font-size: 15px; white-space: pre-wrap; }

        /* Event Card */
        .card {
            background-color: #282828; border: 1px solid #363636; border-radius: 4px;
            display: flex; min-height: 92px; cursor: pointer; transition: all 0.2s;
            position: relative; overflow: hidden;
        }
        .card:hover { background-color: #303030; border-color: #444444; }
        .card-accent { width: 6px; min-height: 100%; }
        .card-content { display: flex; flex: 1; padding: 12px 16px 12px 10px; align-items: center; justify-content: space-between; gap: 10px;}
        .card-left { display: flex; flex-direction: column; justify-content: center; gap: 6px; flex: 1; }
        .card-title { font-size: 17px; font-weight: bold; color: #FFFFFF; word-wrap: break-word; }
        .card-date { font-size: 13px; color: #A0A0A0; }
        .card-right { display: flex; flex-direction: column; align-items: flex-end; text-align: right; gap: 2px;}
        .card-status { font-size: 12px; color: #8C8C8C; }
        .card-value { font-size: 26px; font-weight: bold; line-height: 1.1; }
        .card-unit { font-size: 11px; color: #8C8C8C; }

        /* Floating Action Button */
        .fab {
            position: absolute; bottom: 24px; right: 24px; width: 54px; height: 54px;
            border-radius: 50%; background-color: #F16529; border: none; outline: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center;
        }
        .fab:hover { background-color: #FF773D; }
        .fab:active { background-color: #D8521A; }
        .fab::before, .fab::after {
            content: ''; position: absolute; background-color: white; border-radius: 2px;
        }
        .fab::before { width: 16px; height: 4px; }
        .fab::after { width: 4px; height: 16px; }

        /* Context Menu */
        #context-menu {
            position: absolute; display: none; background: #2F2F2F; border: 1px solid #444444;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5); border-radius: 4px; padding: 4px 0; z-index: 1000; min-width: 120px;
        }
        .cm-item { padding: 8px 16px; font-size: 13px; cursor: pointer; color: #FFFFFF; }
        .cm-item:hover { background: #F16529; }

        /* Modal Overlay */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal {
            background: #242424; width: 90%; max-width: 420px; border-radius: 6px;
            padding: 20px; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        .modal h2 { font-size: 18px; margin-bottom: 4px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 13px; color: #E0E0E0; }
        .modal input[type="text"], .modal input[type="date"], .modal textarea {
            background: #333333; border: 1px solid #444444; border-radius: 4px;
            color: #FFF; padding: 8px; font-size: 14px; outline: none;
        }
        .modal input:focus, .modal textarea:focus { border-color: #F16529; }
        .modal textarea { resize: none; height: 60px; }
        
        .checkbox-group { display: flex; gap: 12px; font-size: 13px; color: #E0E0E0; margin-top: 4px; }
        .checkbox-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
        
        .color-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
        .color-btn {
            width: 32px; height: 32px; border-radius: 6px; border: none; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: white; font-size: 16px;
        }
        .color-btn.selected { border: 2px solid white; box-shadow: inset 0 0 0 2px rgba(0,0,0,0.3); }
        #custom-color-picker { background: #333333; border: 1px solid #444444; height: 32px; padding: 0; cursor: pointer; width: 40px;}

        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .btn-cancel { background: #383838; color: white; padding: 8px 16px; border-radius: 4px; font-size: 13px; }
        .btn-cancel:hover { background: #4A4A4A; }
        .btn-save { background: #F16529; color: white; padding: 8px 16px; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .btn-save:hover { background: #FF773D; }

    </style>
</head>
<body>

<div id="app">
    <!-- Context Menu -->
    <div id="context-menu">
        <div class="cm-item" onclick="triggerEdit()">Edit Event</div>
        <div class="cm-item" onclick="triggerDelete()">Delete Event</div>
    </div>

    <!-- Hidden Input for Import -->
    <input type="file" id="file-import" accept=".json" style="display:none">

    <!-- Top Navigation -->
    <div class="top-bar">
        <div class="header-row">
            <div class="title-container">
                <!-- Embedded Application SVG Logo -->
                <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#242426"/><stop offset="50%" stop-color="#18181a"/><stop offset="100%" stop-color="#0f0f11"/></linearGradient>
                        <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff7a3d"/><stop offset="100%" stop-color="#f16529"/></linearGradient>
                        <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="70%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
                        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="40%" stop-color="#ffffff"/><stop offset="70%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#64748b"/></linearGradient>
                        <linearGradient id="fabGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff8246"/><stop offset="100%" stop-color="#d8521a"/></linearGradient>
                    </defs>
                    <g transform="translate(128, 128) scale(0.88) translate(-128, -128)">
                        <rect x="18" y="18" width="220" height="220" rx="46" fill="url(#bgGrad)" stroke="#f16529" stroke-width="2.5"/>
                        <rect x="22" y="22" width="212" height="212" rx="42" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.1"/>
                        <rect x="42" y="92" width="172" height="106" rx="12" fill="url(#pageGrad)"/>
                        <line x1="44" y1="145" x2="212" y2="145" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 3"/>
                        <path d="M 42 66 C 42 58, 48 52, 56 52 L 200 52 C 208 52, 214 58, 214 66 L 214 96 L 42 96 Z" fill="url(#headerGrad)"/>
                        <text x="128" y="78" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" letter-spacing="3" text-anchor="middle" fill="#ffffff">DAYS</text>
                        <text x="128" y="142" font-family="'Segoe UI', sans-serif" font-size="44" font-weight="900" text-anchor="middle" fill="#18181b">24</text>
                        <text x="128" y="176" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#71717a">COUNTER</text>
                        <circle cx="74" cy="54" r="5" fill="#18181b"/>
                        <rect x="71" y="44" width="6" height="20" rx="3" fill="url(#ringGrad)" stroke="#475569" stroke-width="0.8"/>
                        <circle cx="182" cy="54" r="5" fill="#18181b"/>
                        <rect x="179" y="44" width="6" height="20" rx="3" fill="url(#ringGrad)" stroke="#475569" stroke-width="0.8"/>
                        <circle cx="196" cy="196" r="28" fill="url(#fabGrad)" stroke="#ffffff" stroke-width="2"/>
                        <line x1="184" y1="196" x2="208" y2="196" stroke="#ffffff" stroke-width="4.2" stroke-linecap="square"/>
                        <line x1="196" y1="184" x2="196" y2="208" stroke="#ffffff" stroke-width="4.2" stroke-linecap="square"/>
                    </g>
                </svg>
                <span>Days Counter</span>
            </div>
            <div class="action-buttons">
                <select id="sort-select" class="btn" onchange="setSortOption(this.value)">
                    <option value="DATE_ASC">Ascending date</option>
                    <option value="DATE_DESC">Descending date</option>
                    <option value="TITLE_AZ">By title (A-Z)</option>
                    <option value="TITLE_ZA">By title (Z-A)</option>
                    <option value="ADDED_ASC">Ascending date added</option>
                    <option value="ADDED_DESC">Descending date added</option>
                </select>
                <button class="btn" onclick="document.getElementById('file-import').click()">Load JSON</button>
                <button class="btn" onclick="exportBackup()">Save JSON</button>
                <button class="btn btn-clear" onclick="confirmClear()">Clear</button>
            </div>
        </div>
        <div class="today-label" id="today-label">Today: </div>
    </div>

    <!-- Tabs Container -->
    <div class="tabs" id="tabs-container"></div>

    <!-- Scrollable Event Cards -->
    <div class="scroll-area" id="cards-container"></div>

    <!-- Add Floating Action Button -->
    <button class="fab" onclick="openModal()"></button>

    <!-- Modal Dialog -->
    <div class="modal-overlay" id="modal-overlay" onmousedown="closeModalOut(event)">
        <div class="modal" id="modal">
            <h2 id="modal-title">Add Event</h2>
            
            <div class="input-group">
                <label>Title:</label>
                <input type="text" id="ev-title" placeholder="Event title" autocomplete="off">
            </div>
            
            <div class="input-group">
                <label>Label:</label>
                <input type="text" id="ev-label" list="label-list" placeholder="e.g. Normal, Personal, Work" autocomplete="off">
                <datalist id="label-list"></datalist>
            </div>
            
            <div class="input-group">
                <label>Date:</label>
                <input type="date" id="ev-date">
            </div>
            
            <div class="input-group">
                <label>Description:</label>
                <textarea id="ev-desc" placeholder="Optional description"></textarea>
            </div>
            
            <div class="input-group">
                <label>Show Units:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="ev-y"> Years</label>
                    <label><input type="checkbox" id="ev-m"> Months</label>
                    <label><input type="checkbox" id="ev-w"> Weeks</label>
                    <label><input type="checkbox" id="ev-d"> Days</label>
                </div>
            </div>
            
            <div class="input-group" style="margin-top: 4px;">
                <label>Accent Color:</label>
                <div class="color-row" id="color-picker">
                    <!-- Dynamic colors inserted here -->
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-save" onclick="saveEvent()">Save</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- Constants & Global State ---
    const PALETTE_COLORS = [
        4294010153, // Orange
        4293245237, // Red
        4287505578, // Purple
        4280207589, // Blue
        4282622023, // Green
        4294826037  // Yellow
    ];
    
    let events = [];
    let currentSort = "DATE_ASC";
    let currentTab = "Normal";
    let editingId = null;
    let selectedColorInt = PALETTE_COLORS[0];
    let contextMenuId = null;

    // --- Color Utilities ---
    function intToHex(colorInt) {
        let hex = (colorInt >>> 0).toString(16).padStart(8, '0');
        let a = hex.substring(0, 2);
        let r = hex.substring(2, 4);
        let g = hex.substring(4, 6);
        let b = hex.substring(6, 8);
        return `#${r}${g}${b}${a === 'ff' ? '' : a}`;
    }

    function hexToInt(hexStr) {
        let cleanHex = hexStr.replace('#', '');
        let r = cleanHex.substring(0, 2);
        let g = cleanHex.substring(2, 4);
        let b = cleanHex.substring(4, 6);
        return parseInt(`ff${r}${g}${b}`, 16);
    }

    // --- Date Utilities (Matching Python Logic precisely via UTC to ignore DST) ---
    const MS_PER_DAY = 1000 * 60 * 60 * 24;

    function dateToEpochDay(dateObj) {
        return Math.floor(Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()) / MS_PER_DAY);
    }

    function epochDayToDate(epochDay) {
        return new Date(Date.UTC(1970, 0, epochDay));
    }

    function getTodayUTC() {
        const now = new Date();
        return new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
    }

    function formatDisplayDateString(dateObj) {
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        return `${dateObj.getUTCDate()} ${months[dateObj.getUTCMonth()]} ${dateObj.getUTCFullYear()}`;
    }

    // --- Time Difference Calculator (Replicating exact Python script math) ---
    function addYears(dateObj, years) {
        const d = new Date(dateObj);
        d.setUTCFullYear(d.getUTCFullYear() + years);
        return d;
    }

    function addMonths(dateObj, months) {
        const d = new Date(dateObj);
        d.setUTCMonth(d.getUTCMonth() + months);
        return d;
    }

    function calculateTimeDiff(start, end, showY, showM, showW, showD) {
        let current = new Date(start);
        let years = 0, months = 0, weeks = 0, days = 0;

        if (showY) {
            let guessY = end.getUTCFullYear() - current.getUTCFullYear();
            if (addYears(current, guessY) > end) guessY--;
            years = Math.max(0, guessY);
            current = addYears(current, years);
        }

        if (showM) {
            let guessM = (end.getUTCFullYear() - current.getUTCFullYear()) * 12 + (end.getUTCMonth() - current.getUTCMonth());
            if (addMonths(current, guessM) > end) guessM--;
            months = Math.max(0, guessM);
            current = addMonths(current, months);
        }

        if (showW) {
            let remainingDays = Math.floor((end - current) / MS_PER_DAY);
            weeks = Math.max(0, Math.floor(remainingDays / 7));
            current.setUTCDate(current.getUTCDate() + weeks * 7);
        }

        if (showD) {
            days = Math.max(0, Math.floor((end - current) / MS_PER_DAY));
        }

        return { years, months, weeks, days };
    }

    // --- Core Logic ---
    function initApp() {
        document.getElementById('today-label').innerText = `Today: ${formatDisplayDateString(getTodayUTC())}`;
        loadFromStorage();
        setupColorPicker();
        
        // Import JSON file listener
        document.getElementById('file-import').addEventListener('change', function(e) {
            if (!e.target.files.length) return;
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const imported = JSON.parse(event.target.result);
                    let rawEvents = Array.isArray(imported) ? imported : 
                                    (imported.events || imported.data || imported.items || [imported]);
                    
                    let newEvents = rawEvents.filter(ev => typeof ev === 'object').map(item => ({
                        id: item.id || (Date.now() % 100000) + Math.floor(Math.random()*1000),
                        title: String(item.title || item.name || item.eventTitle || item.text || "Untitled").trim(),
                        description: String(item.description || item.desc || item.note || "").trim(),
                        label: String(item.label || "Normal").trim() || "Normal",
                        epochDay: item.epochDay != null ? parseInt(item.epochDay) : dateToEpochDay(getTodayUTC()),
                        createdAt: item.createdAt || Date.now(),
                        colorHex: item.colorHex || PALETTE_COLORS[0],
                        showYears: !!item.showYears,
                        showMonths: !!item.showMonths,
                        showWeeks: !!item.showWeeks,
                        showDays: item.showDays !== undefined ? !!item.showDays : true
                    }));

                    if (newEvents.length > 0) {
                        events = newEvents;
                        saveToStorage();
                        renderApp();
                        alert(`Successfully loaded ${newEvents.length} events.`);
                    } else {
                        alert("No valid events found in file.");
                    }
                } catch(err) {
                    alert("Failed to parse JSON file:\n" + err);
                }
            };
            reader.readAsText(file);
            e.target.value = ''; // Reset
        });

        // Context Menu outside click
        document.addEventListener('click', (e) => {
            if(!e.target.closest('#context-menu') && !e.target.closest('.card')) {
                document.getElementById('context-menu').style.display = 'none';
            }
        });
    }

    function loadFromStorage() {
        try {
            const data = localStorage.getItem("days_counter_events");
            if (data) events = JSON.parse(data);
        } catch(e) { console.error("Could not load from local storage", e); }
        renderApp();
    }

    function saveToStorage() {
        localStorage.setItem("days_counter_events", JSON.stringify(events));
    }

    function confirmClear() {
        if (confirm("Are you sure you want to clear all stored events?")) {
            events = [];
            localStorage.removeItem("days_counter_events");
            renderApp();
        }
    }

    function setSortOption(val) {
        currentSort = val;
        renderApp();
    }

    function getSortedEvents() {
        let evs = [...events];
        evs.sort((a, b) => {
            if (currentSort === "TITLE_AZ") return a.title.localeCompare(b.title);
            if (currentSort === "TITLE_ZA") return b.title.localeCompare(a.title);
            if (currentSort === "DATE_ASC") return a.epochDay - b.epochDay;
            if (currentSort === "DATE_DESC") return b.epochDay - a.epochDay;
            if (currentSort === "ADDED_ASC") return a.createdAt - b.createdAt;
            if (currentSort === "ADDED_DESC") return b.createdAt - a.createdAt;
            return 0;
        });
        return evs;
    }

    // --- UI Rendering ---
    function renderApp() {
        // Find unique labels
        let labels = new Set(["Normal"]);
        events.forEach(ev => { if(ev.label) labels.add(ev.label.trim() || "Normal"); });
        let sortedLabels = Array.from(labels).sort();

        // Check active tab
        if (!sortedLabels.includes(currentTab)) currentTab = sortedLabels[0];

        // Render Tabs
        const tabsContainer = document.getElementById("tabs-container");
        tabsContainer.innerHTML = "";
        sortedLabels.forEach(lbl => {
            let div = document.createElement("div");
            div.className = "tab" + (lbl === currentTab ? " active" : "");
            div.innerText = lbl;
            div.onclick = () => { currentTab = lbl; renderApp(); };
            tabsContainer.appendChild(div);
        });

        // Render Datalist for form
        const dataList = document.getElementById("label-list");
        dataList.innerHTML = "";
        sortedLabels.forEach(lbl => {
            let opt = document.createElement("option");
            opt.value = lbl;
            dataList.appendChild(opt);
        });

        // Render Cards
        const container = document.getElementById("cards-container");
        container.innerHTML = "";
        
        let filtered = getSortedEvents().filter(ev => (ev.label || "Normal") === currentTab);
        
        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-label">No events under label '${currentTab}'.\n\nClick '+' to add an event.</div>`;
            return;
        }

        const todayUTC = getTodayUTC();

        filtered.forEach(ev => {
            const evDate = epochDayToDate(ev.epochDay);
            const isPassed = evDate <= todayUTC;
            const start = isPassed ? evDate : todayUTC;
            const end = isPassed ? todayUTC : evDate;
            const diff = calculateTimeDiff(start, end, ev.showYears, ev.showMonths, ev.showWeeks, ev.showDays);
            
            let vals = [], lbls = [];
            if (ev.showYears) { vals.push(diff.years); lbls.push("years"); }
            if (ev.showMonths) { vals.push(diff.months); lbls.push("months"); }
            if (ev.showWeeks) { vals.push(diff.weeks); lbls.push("weeks"); }
            if (ev.showDays) { vals.push(diff.days); lbls.push("days"); }
            if (vals.length === 0) { vals.push(0); lbls.push("days"); }

            const colorHex = intToHex(ev.colorHex);

            const card = document.createElement('div');
            card.className = "card";
            card.oncontextmenu = (e) => showContextMenu(e, ev.id);
            card.onclick = (e) => { 
                if(!e.target.closest('#context-menu')) editEvent(ev.id); 
            };
            
            card.innerHTML = `
                <div class="card-accent" style="background-color: ${colorHex};"></div>
                <div class="card-content">
                    <div class="card-left">
                        <div class="card-title">${escapeHTML(ev.title)}</div>
                        <div class="card-date">${formatDisplayDateString(evDate)}</div>
                    </div>
                    <div class="card-right">
                        <div class="card-status">${isPassed ? "Passed" : "Left"}</div>
                        <div class="card-value" style="color: ${colorHex};">${vals.join('/')}</div>
                        <div class="card-unit">${lbls.join('/')}</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // --- Modal Forms & Interactions ---
    function setupColorPicker() {
        const cp = document.getElementById("color-picker");
        cp.innerHTML = "";
        PALETTE_COLORS.forEach(c => {
            let btn = document.createElement("button");
            btn.className = "color-btn";
            btn.style.backgroundColor = intToHex(c);
            btn.onclick = (e) => selectColor(c, e.target);
            cp.appendChild(btn);
        });

        // Custom Color
        let customInput = document.createElement("input");
        customInput.type = "color";
        customInput.id = "custom-color-picker";
        customInput.className = "color-btn";
        customInput.title = "Custom Color";
        customInput.onchange = (e) => {
            selectColor(hexToInt(e.target.value), customInput);
        };
        cp.appendChild(customInput);
    }

    function selectColor(colorInt, element) {
        selectedColorInt = colorInt;
        document.querySelectorAll(".color-btn").forEach(b => {
            b.classList.remove("selected");
            b.innerHTML = "";
        });
        element.classList.add("selected");
        element.innerHTML = "✓";
        if(element.id !== "custom-color-picker"){
            document.getElementById("custom-color-picker").value = intToHex(colorInt).substring(0,7);
        }
    }

    function openModal(evId = null) {
        editingId = evId;
        const modalTitle = document.getElementById("modal-title");
        
        let targetEv = events.find(e => e.id === evId);
        
        document.getElementById("ev-title").value = targetEv ? targetEv.title : "";
        document.getElementById("ev-label").value = targetEv ? targetEv.label : currentTab;
        document.getElementById("ev-desc").value = targetEv ? targetEv.description : "";
        
        document.getElementById("ev-y").checked = targetEv ? targetEv.showYears : false;
        document.getElementById("ev-m").checked = targetEv ? targetEv.showMonths : false;
        document.getElementById("ev-w").checked = targetEv ? targetEv.showWeeks : false;
        document.getElementById("ev-d").checked = targetEv ? targetEv.showDays : true;

        // Date input logic
        let dateObj = targetEv ? epochDayToDate(targetEv.epochDay) : getTodayUTC();
        let yyyy = dateObj.getUTCFullYear();
        let mm = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
        let dd = String(dateObj.getUTCDate()).padStart(2, '0');
        document.getElementById("ev-date").value = `${yyyy}-${mm}-${dd}`;

        // Color picking logic
        let colorToSet = targetEv ? targetEv.colorHex : PALETTE_COLORS[0];
        const cp = document.getElementById("color-picker");
        let btnIndex = PALETTE_COLORS.indexOf(colorToSet);
        if (btnIndex !== -1) {
            selectColor(colorToSet, cp.children[btnIndex]);
        } else {
            let customInput = document.getElementById("custom-color-picker");
            customInput.value = intToHex(colorToSet).substring(0, 7);
            selectColor(colorToSet, customInput);
        }

        modalTitle.innerText = targetEv ? "Edit Event" : "Add Event";
        document.getElementById("modal-overlay").style.display = "flex";
        document.getElementById("ev-title").focus();
    }

    function closeModal() {
        document.getElementById("modal-overlay").style.display = "none";
    }

    function closeModalOut(e) {
        if(e.target.id === 'modal-overlay') closeModal();
    }

    function saveEvent() {
        let title = document.getElementById("ev-title").value.trim();
        if (!title) { alert("Please enter a title for the event."); return; }

        let yCheck = document.getElementById("ev-y").checked;
        let mCheck = document.getElementById("ev-m").checked;
        let wCheck = document.getElementById("ev-w").checked;
        let dCheck = document.getElementById("ev-d").checked;
        if (!yCheck && !mCheck && !wCheck && !dCheck) dCheck = true; // enforce at least 1 unit

        let dateStr = document.getElementById("ev-date").value;
        if(!dateStr) { alert("Please pick a valid date."); return; }
        
        let [y, m, d] = dateStr.split('-');
        let evDateUTC = new Date(Date.UTC(y, m-1, d));
        let epochDay = dateToEpochDay(evDateUTC);

        let newEv = {
            id: editingId !== null ? editingId : (Date.now() % 100000),
            title: title,
            description: document.getElementById("ev-desc").value.trim(),
            label: document.getElementById("ev-label").value.trim() || "Normal",
            epochDay: epochDay,
            createdAt: editingId !== null ? events.find(e=>e.id===editingId).createdAt : Date.now(),
            colorHex: selectedColorInt,
            showYears: yCheck,
            showMonths: mCheck,
            showWeeks: wCheck,
            showDays: dCheck
        };

        if (editingId !== null) {
            const idx = events.findIndex(e => e.id === editingId);
            if (idx !== -1) events[idx] = newEv;
        } else {
            events.push(newEv);
        }

        // Switch tab to the newly created event's label
        currentTab = newEv.label;
        
        saveToStorage();
        closeModal();
        renderApp();
    }

    function showContextMenu(e, id) {
        e.preventDefault();
        e.stopPropagation();
        contextMenuId = id;
        const menu = document.getElementById("context-menu");
        menu.style.display = "block";
        
        // Prevent menu from clipping off-screen
        let top = e.pageY;
        let left = e.pageX;
        menu.style.top = top + "px";
        menu.style.left = left + "px";
    }

    function triggerEdit() {
        document.getElementById("context-menu").style.display = "none";
        if(contextMenuId !== null) editEvent(contextMenuId);
    }

    function triggerDelete() {
        document.getElementById("context-menu").style.display = "none";
        if(contextMenuId !== null) deleteEvent(contextMenuId);
    }

    function editEvent(id) {
        openModal(id);
    }

    function deleteEvent(id) {
        let ev = events.find(e => e.id === id);
        if(!ev) return;
        if (confirm(`Are you sure you want to delete "${ev.title}"?`)) {
            events = events.filter(e => e.id !== id);
            saveToStorage();
            renderApp();
        }
    }

    // --- Export Logic ---
    function exportBackup() {
        let dateIso = new Date().toISOString().split('T')[0];
        let filename = `days_counter_backup_${dateIso}.json`;
        let blob = new Blob([JSON.stringify(events, null, 2)], { type: "application/json;charset=utf-8" });
        let url = URL.createObjectURL(blob);
        
        let a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        
        setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 0);
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    // Initialize application on load
    window.onload = initApp;
</script>
</body>
</html>
